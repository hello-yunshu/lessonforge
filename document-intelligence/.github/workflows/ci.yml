name: release-candidate-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/development.txt
      - name: Install exact development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/development.txt
          python -m pip install --no-deps -e .
      - name: Generate fixtures
        run: python scripts/generate_fixtures.py
      - name: Ruff
        run: |
          ruff format --check src tests scripts
          ruff check src tests scripts
      - name: Mypy
        run: mypy src/document_intelligence
      - name: Deterministic static and secret gates
        run: |
          python scripts/static_sanity.py
          python scripts/secret_scan.py
      - name: Tests with hard batch limits
        run: |
          timeout 120s pytest -q tests/campaign tests/contract tests/domain_pack_sdk tests/domain_regression tests/domain_runtime tests/family tests/freeze tests/golden
          timeout 120s pytest -q tests/matching tests/mlops tests/production tests/review tests/rill
          timeout 120s pytest -q tests/security tests/structure tests/unit
          timeout 120s pytest -q tests/integration
      - name: Coverage
        run: |
          pytest --timeout=45 --cov=document_intelligence --cov-branch \
            --cov-report=term-missing --cov-report=xml -q
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Phase 1-12 gates
        run: PYTHONPATH=src python scripts/verify_all.py
      - name: Dependency inventory and SPDX SBOM
        run: |
          PYTHONPATH=src python scripts/generate_dependency_report.py
          python scripts/generate_sbom.py
      - name: Dependency vulnerability audit
        run: pip-audit --strict --desc
      - name: Reproducible release-candidate build
        run: python scripts/build_release_candidate.py
      - name: Upload release-candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: document-intelligence-rc
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/document-intelligence_phase12_1.0.3-rc.1.zip
            dist/document-intelligence_phase12_1.0.3-rc.1.zip.sha256
            dist/document_intelligence-*.whl
            docs/phase-12/*.json
            docs/phase-12/*.md
            SHA256SUMS

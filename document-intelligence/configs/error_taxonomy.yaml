version: 3
levels:
  P0:
    description: "污染标准结果、跨文档串写、证据丢失、路径越界、安全边界绕过、错误标准结果自动复用"
    auto_accept: false
  P1:
    description: "关键内容错误、页面丢失、解析器版本或摘要不符合配置、标准匹配歧义被错误接受"
    auto_accept: false
  P2:
    description: "非关键结构偏差、性能退化、可恢复的外部解析器故障、无法安全匹配"
    auto_accept: false

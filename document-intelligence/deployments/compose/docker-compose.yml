services:
  api:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${DI_PYTHON_BASE_IMAGE:?set a digest-pinned Python image}
    ports:
      - "127.0.0.1:${DI_HOST_PORT:-8080}:8080"
    environment:
      DI_DEPLOYMENT_PROFILE: production
      DI_WORKSPACE: /data
      DI_PARSER_CONFIG: /app/configs/parsers.yaml
      DI_API_TENANT_TOKENS_SHA256_JSON: ${DI_API_TENANT_TOKENS_SHA256_JSON:?required}
      DI_API_REQUESTS_PER_MINUTE: ${DI_API_REQUESTS_PER_MINUTE:-120}
      DI_API_MAX_CONCURRENT_REQUESTS_PER_TENANT: ${DI_API_MAX_CONCURRENT_REQUESTS_PER_TENANT:-4}
      DI_API_REQUEST_TIMEOUT_SECONDS: ${DI_API_REQUEST_TIMEOUT_SECONDS:-120}
      DI_METRICS_ACCESS_TOKEN_SHA256: ${DI_METRICS_ACCESS_TOKEN_SHA256:-}
      DI_SINGLE_NODE_MODE: "true"
      DI_PDF_RENDER_BACKEND: ${DI_PDF_RENDER_BACKEND:-disabled}
      DI_PYMUPDF_LICENSE_RESOLVED: ${DI_PYMUPDF_LICENSE_RESOLVED:-false}
      DI_DEFAULT_PARSER: ${DI_DEFAULT_PARSER:-auto}
      DI_ENABLE_STANDARD_WRITES: ${DI_ENABLE_STANDARD_WRITES:-false}
      DI_STANDARD_ACCESS_TOKEN_SHA256: ${DI_STANDARD_ACCESS_TOKEN_SHA256:-}
      DI_ENABLE_DOMAIN_PACK_WRITES: ${DI_ENABLE_DOMAIN_PACK_WRITES:-false}
      DI_DOMAIN_PACK_ACCESS_TOKEN_SHA256: ${DI_DOMAIN_PACK_ACCESS_TOKEN_SHA256:-}
      DI_DOMAIN_PACK_REQUIRE_SIGNATURES: ${DI_DOMAIN_PACK_REQUIRE_SIGNATURES:-true}
      DI_DOMAIN_PACK_TRUSTED_KEYS_JSON: ${DI_DOMAIN_PACK_TRUSTED_KEYS_JSON:-{}}
      DI_RILL_SHADOW_BACKEND: ${DI_RILL_SHADOW_BACKEND:-disabled}
      DI_RILL_REFERENCE_BACKEND_ALLOWED: "false"
      DI_ENABLE_RILL_SHADOW_WRITES: ${DI_ENABLE_RILL_SHADOW_WRITES:-false}
      DI_RILL_ACCESS_TOKEN_SHA256: ${DI_RILL_ACCESS_TOKEN_SHA256:-}
      DI_ENABLE_RILL_ASSIST_WRITES: ${DI_ENABLE_RILL_ASSIST_WRITES:-false}
      DI_ENABLE_RILL_ASSIST_EXECUTION: ${DI_ENABLE_RILL_ASSIST_EXECUTION:-false}
      DI_RILL_ASSIST_ACCESS_TOKEN_SHA256: ${DI_RILL_ASSIST_ACCESS_TOKEN_SHA256:-}
      DI_ENABLE_MLOPS_WRITES: ${DI_ENABLE_MLOPS_WRITES:-false}
      DI_ENABLE_MLOPS_RELEASE: ${DI_ENABLE_MLOPS_RELEASE:-false}
      DI_MLOPS_ACCESS_TOKEN_SHA256: ${DI_MLOPS_ACCESS_TOKEN_SHA256:-}
      DI_ENABLE_PRODUCTION_QUALIFICATION_WRITES: ${DI_ENABLE_PRODUCTION_QUALIFICATION_WRITES:-false}
      DI_PRODUCTION_QUALIFICATION_ACCESS_TOKEN_SHA256: ${DI_PRODUCTION_QUALIFICATION_ACCESS_TOKEN_SHA256:-}
      DI_ENABLE_QUALIFICATION_CAMPAIGN_WRITES: ${DI_ENABLE_QUALIFICATION_CAMPAIGN_WRITES:-false}
      DI_QUALIFICATION_CAMPAIGN_ACCESS_TOKEN_SHA256: ${DI_QUALIFICATION_CAMPAIGN_ACCESS_TOKEN_SHA256:-}
    volumes:
      - document_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    pids_limit: 256
    mem_limit: ${DI_MEMORY_LIMIT:-4g}
    cpus: ${DI_CPU_LIMIT:-2.0}
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  document_data:

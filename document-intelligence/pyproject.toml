[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "document-intelligence"
version = "1.0.3rc1"
description = "通用复杂文档智能解析、多领域适配与受控 RillML Assist/MLOps 平台"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "document-intelligence contributors"}]
license = "AGPL-3.0"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Text Processing :: General",
]
dependencies = [
  "fastapi==0.141.1",
  "starlette==1.6.0",
  "httpx==0.28.1",
  "pillow==12.3.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "pypdf==6.16.1",
  "numpy==2.3.5",
  "opencv-python-headless==4.13.0.92",
  "python-multipart==0.0.31",
  "pyyaml==6.0.3",
  "packaging==25.0",
  "cryptography==50.0.0",
  "uvicorn==0.48.0",
]

[project.optional-dependencies]
render-pymupdf = ["pymupdf==1.26.7"]
dev = [
  "build==1.3.0",
  "coverage[toml]==7.13.3",
  "mypy==1.19.1",
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "ruff==0.14.14",
  "pytest-timeout==2.4.0",
  "cyclonedx-bom==7.2.1",
  "pip-audit==2.9.0",
  "pymupdf==1.26.7",
]

[project.scripts]
doc-intelligence = "document_intelligence.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --durations=20"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: integration test",
  "contract: parser contract test",
  "slow: bounded slow or soak-style test",
]

[tool.coverage.run]
branch = true
source = ["document_intelligence"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["document_intelligence"]
warn_unused_ignores = true

[tool.setuptools.package-data]
document_intelligence = [
  "py.typed",
  "defaults/*.yaml",
  "defaults/domain_packs/*/*.yaml",
  "defaults/domain_packs/*/family.yaml",
  "defaults/domain_packs/*/rules/*.yaml",
  "defaults/domain_packs/*/validators/*.yaml",
  "defaults/domain_packs/*/review/*.yaml",
  "defaults/*.json",
]

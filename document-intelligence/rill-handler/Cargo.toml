[package]
name = "lessonforge-shadow-handler"
version = "1.2.0"
edition = "2021"
publish = false
description = "LessonForge-owned bounded Stable Handler API v1 consumer component."

[[bin]]
name = "lessonforge-shadow-handler"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
wit-bindgen = "0.29"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
